context:
  version: "6.10.2"
  maj_min: ${{ (version | split('.'))[:2] | join('.') }}

package:
  name: qt6-graphs
  version: ${{ version }}

source:
  url: https://download.qt.io/official_releases/qt/${{ maj_min }}/${{ version }}/submodules/qtgraphs-everywhere-src-${{ version }}.tar.xz
  md5: b8ac2537e55640e94b8ba84e15551a3e

build:
  number: 1

requirements:
  build:
    - cmake
    - ninja
    - perl
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - qt6-main ${{ version }}.*
  host:
    - qt6-main ${{ version }}.*
    - qt6-quick3d ${{ version }}.*
    - if: linux
      then:
        - libgl-devel
        - libegl-devel
        - libopengl-devel
    - if: not osx
      then:
        - libvulkan-headers
        - libvulkan-loader
  run:
    - qt6-main ${{ version }}.*
  run_exports:
    - ${{ pin_subpackage('qt6-graphs', upper_bound='x.x') }}

tests:
  - script:
      - if: unix
        then:
          - test -d $PREFIX/include/qt6/QtGraphs
          - test -f $PREFIX/lib/libQt6Graphs${SHLIB_EXT}
        else:
          - if not exist %PREFIX%\\Library\\include\\qt6\\QtGraphs exit 1
          - if not exist %PREFIX%\\Library\\lib\\Qt6Graphs.lib exit 1
          - if not exist %PREFIX%\\Library\\bin\\Qt6Graphs.dll exit 1

about:
  homepage: http://qt-project.org
  license: GPL-3.0-only
  license_file: LICENSES/GPL-3.0-only.txt
  summary: Qt is a cross-platform application and UI framework.
  description: |
    Qt helps you create connected devices, UIs & applications that run
    anywhere on any device, on any operating system at any time.
  documentation: http://doc.qt.io/
  repository: https://github.com/qt/qtgraphs

extra:
  recipe-maintainers:
    - jschueller
  feedstock-name: qt-graphs
